---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ibmcloudmanagedclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: IBMCloudManagedCluster
    listKind: IBMCloudManagedClusterList
    plural: ibmcloudmanagedclusters
    shortNames:
    - ibmcmc
    singular: ibmcloudmanagedcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this IBMCloudManagedCluster belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: IBM Cloud region
      jsonPath: .spec.region
      name: Region
      type: string
    - description: Resolved VPC ID
      jsonPath: .status.vpc.id
      name: VPC
      type: string
    - description: Every network reference resolved and validated
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - description: Time duration since creation of IBMCloudManagedCluster
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IBMCloudManagedCluster is the InfraCluster of an IBM Cloud managed
          (IKS or ROKS) cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired network inventory.
            properties:
              region:
                description: region is the IBM Cloud multizone region, for example
                  us-south. Immutable.
                maxLength: 32
                minLength: 1
                pattern: ^[a-z]{2}-[a-z]+$
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              resourceGroup:
                description: resourceGroup is the resource group of the IBM cluster
                  (X-Auth-Resource-Group). Immutable.
                properties:
                  id:
                    description: id is the 32-character resource group ID.
                    maxLength: 32
                    minLength: 32
                    pattern: ^[a-f0-9]{32}$
                    type: string
                required:
                - id
                type: object
                x-kubernetes-validations:
                - message: resourceGroup is immutable
                  rule: self == oldSelf
              vpc:
                description: vpc is the existing VPC the workers attach to. Immutable.
                properties:
                  reference:
                    description: reference identifies the existing VPC by id or name.
                    minProperties: 1
                    properties:
                      id:
                        description: id of the resource.
                        maxLength: 64
                        minLength: 1
                        type: string
                      name:
                        description: name of the resource.
                        maxLength: 128
                        minLength: 1
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of id or name must be specified
                      rule: '(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) ==
                        1'
                  type:
                    description: type is Reference (an existing VPC).
                    enum:
                    - Reference
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: vpc is immutable
                  rule: self == oldSelf
                - message: reference is required when type is Reference, and forbidden
                    otherwise
                  rule: 'self.type == ''Reference'' ? has(self.reference) : !has(self.reference)'
              zones:
                description: |-
                  zones maps each zone the cluster may use to one subnet. Zones can be added. In v1alpha1 an existing zone can be
                  neither removed nor pointed at another subnet (IBM has no API to move a pool zone to another subnet).
                items:
                  description: ZoneSubnet binds a VPC zone to one existing subnet.
                  properties:
                    name:
                      description: name is the VPC zone, for example us-south-1.
                      maxLength: 40
                      minLength: 1
                      pattern: ^[a-z]{2}-[a-z]+-[0-9]+$
                      type: string
                    subnet:
                      description: subnet is an existing subnet of spec.vpc in this
                        zone. Give it at least 256 addresses; IBM cannot resize it
                        later.
                      minProperties: 1
                      properties:
                        id:
                          description: id of the resource.
                          maxLength: 64
                          minLength: 1
                          type: string
                        name:
                          description: name of the resource.
                          maxLength: 128
                          minLength: 1
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of id or name must be specified
                        rule: '(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) ==
                          1'
                  required:
                  - name
                  - subnet
                  type: object
                maxItems: 3
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: zones can be added; existing zones cannot be removed or
                    changed in v1alpha1
                  rule: oldSelf.all(o, self.exists(z, z.name == o.name && z.subnet
                    == o.subnet))
            required:
            - region
            - resourceGroup
            - vpc
            - zones
            type: object
            x-kubernetes-validations:
            - message: every zone must belong to region, for example us-south-1 for
                us-south
              rule: self.zones.all(z, z.name.startsWith(self.region + '-'))
          status:
            description: status is the observed state.
            minProperties: 1
            properties:
              conditions:
                description: conditions are Ready (the summary), NetworkReady and
                  Paused.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomains:
                description: failureDomains lists the zones (CAPI InfraCluster contract,
                  list shape).
                items:
                  description: FailureDomain is the CAPI v1beta2 InfraCluster failure-domain
                    shape without the attributes map (KAL forbids maps).
                  properties:
                    name:
                      description: name is the VPC zone.
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 3
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              initialization:
                description: initialization is the CAPI v1beta2 contract block.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true once every reference resolved and validated. It never goes back to false.
                      It is a *bool because the CAPI InfraCluster contract defines it so (a KAL exclusion in .golangci-kal.yml).
                    type: boolean
                type: object
              vpc:
                description: vpc is the resolved VPC.
                minProperties: 1
                properties:
                  id:
                    description: id of the resource.
                    maxLength: 64
                    minLength: 1
                    type: string
                  name:
                    description: name of the resource.
                    maxLength: 128
                    minLength: 1
                    type: string
                type: object
              zones:
                description: zones are the resolved zone subnets the control plane
                  and pools read (explicit inheritance).
                items:
                  description: ResolvedZone is one validated zone.
                  properties:
                    availableIPv4Addresses:
                      description: availableIPv4Addresses at the last check; a condition
                        message warns below 16.
                      format: int32
                      minimum: 0
                      type: integer
                    ipv4CIDRBlock:
                      description: ipv4CIDRBlock of the subnet (used for overlap checks
                        with Cluster.spec.clusterNetwork).
                      maxLength: 43
                      minLength: 1
                      type: string
                    name:
                      description: name is the zone.
                      maxLength: 40
                      minLength: 1
                      type: string
                    publicGateway:
                      description: publicGateway reports a public gateway on the subnet
                        (informational).
                      enum:
                      - Attached
                      - NotAttached
                      type: string
                    subnet:
                      description: subnet is the resolved subnet.
                      minProperties: 1
                      properties:
                        id:
                          description: id of the resource.
                          maxLength: 64
                          minLength: 1
                          type: string
                        name:
                          description: name of the resource.
                          maxLength: 128
                          minLength: 1
                          type: string
                      type: object
                  required:
                  - name
                  - subnet
                  type: object
                maxItems: 3
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
