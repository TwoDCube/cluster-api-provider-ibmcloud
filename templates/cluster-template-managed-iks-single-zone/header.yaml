# clusterctl flavor managed-iks-single-zone: an IBM Cloud Kubernetes Service (IKS) cluster on VPC Gen2 whose control
# plane IBM manages, with 2 workers in one zone, for development and tests. NOT HA: a zone outage stops every worker,
# and IBM may report the ingress as warning or critical (expected and informational; CAPIBM ignores it). Use the
# managed-iks flavor for IBM's HA topology. It reads the first zone and subnet variables of managed-iks, so one set of
# variables serves all managed flavors. The provider must run with the ManagedKubernetes feature gate
# (EXP_MANAGED_KUBERNETES=true). The IBM Cloud credentials are the controller's own; this template has no credential
# variable. templates/README.md lists every variable. Pass --worker-machine-count=2 to clusterctl generate cluster:
# without the flag or the variable it sets WORKER_MACHINE_COUNT to 0, which the default of 2 below cannot override.
