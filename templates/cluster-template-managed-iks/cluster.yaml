apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  # clusterNetwork is omitted on purpose: IBM then picks the next free pod /18 in the VPC and its default service range.
  # Custom pod and service ranges cannot be shared between clusters (IBM containers docs, vpc-subnets.md), so a fixed
  # default here would make the second cluster from this template conflict. To choose ranges, add for example:
  # clusterNetwork:
  #   pods:
  #     cidrBlocks: ["172.17.64.0/18"]     # or the size-only form "0.0.0.0/20"; at least /23
  #   services:
  #     cidrBlocks: ["172.22.0.0/16"]      # at least /24; unique per cluster
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: IBMCloudManagedCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: IBMCloudManagedControlPlane
    name: "${CLUSTER_NAME}-control-plane"
