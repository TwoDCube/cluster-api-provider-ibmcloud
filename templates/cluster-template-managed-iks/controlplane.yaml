---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: IBMCloudManagedControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  distribution: Kubernetes
  distributionVersion: "${IKS_DISTRIBUTION_VERSION:=1.36}"   # MAJOR.MINOR only; IBM applies the newest patch
  # The IBM cluster is named after the Cluster. IBM cluster names are unique per account, so the API server returns an
  # admission warning about other namespaces or management clusters using the same name. To choose a name:
  # ibmCloudClusterName: my-iks-cluster       # immutable
