# clusterctl flavor managed-iks: an IBM Cloud Kubernetes Service (IKS) cluster whose control plane IBM manages, in
# IBM's HA topology of 3 zones x 2 workers per zone, in an existing VPC with one existing subnet per zone.
# Pass --worker-machine-count=6 to clusterctl generate cluster; without it, clusterctl sets WORKER_MACHINE_COUNT to 0.
# The provider needs the ManagedKubernetes feature gate. templates/README.md lists the variables, and the book explains
# the rest: https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/index.html
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  # clusterNetwork is omitted: IBM picks free pod and service ranges. To choose them, see
  # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/creating-a-cluster.html#pod-and-service-networks
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: IBMCloudManagedCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: IBMCloudManagedControlPlane
    name: "${CLUSTER_NAME}-control-plane"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: IBMCloudManagedCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  region: "${IBMCLOUD_REGION}"
  resourceGroup:
    id: "${IBMCLOUD_RESOURCE_GROUP_ID}"
  vpc:                                        # an existing VPC; CAPIBM never creates or deletes VPC resources
    type: Reference
    reference:
      name: "${IBMCLOUD_VPC_NAME}"
  # IBM's HA topology: three zones, one existing subnet in each. Zones can be added later, never removed; see
  # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/topology.html
  zones:
  - name: "${IBMCLOUD_ZONE_1}"
    subnet:
      name: "${IBMCLOUD_SUBNET_NAME_1}"
  - name: "${IBMCLOUD_ZONE_2}"
    subnet:
      name: "${IBMCLOUD_SUBNET_NAME_2}"
  - name: "${IBMCLOUD_ZONE_3}"
    subnet:
      name: "${IBMCLOUD_SUBNET_NAME_3}"
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: IBMCloudManagedControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  distribution: Kubernetes
  distributionVersion: "${IKS_DISTRIBUTION_VERSION:=1.36}"   # MAJOR.MINOR only; IBM applies the newest patch
  # The IBM cluster is named after the Cluster, with an admission warning. To choose the name, see
  # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/creating-a-cluster.html#naming-the-ibm-cluster
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachinePool
metadata:
  name: "${CLUSTER_NAME}-default"
spec:
  clusterName: "${CLUSTER_NAME}"
  # Workers in total, a multiple of the zone count: 6 = 2 per zone, IBM's HA topology. Fewer is not HA; see
  # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/topology.html#smaller-topologies-are-not-ha
  replicas: ${WORKER_MACHINE_COUNT:=6}
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      bootstrap:
        dataSecretName: ""
      # Drain time limits and the replacement soak are Cluster API fields here (deletion, minReadySeconds); see
      # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/worker-pools.html#drain-settings
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: IBMCloudManagedMachinePool
        name: "${CLUSTER_NAME}-default"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: IBMCloudManagedMachinePool
metadata:
  name: "${CLUSTER_NAME}-default"
spec:
  poolName: default                           # the IBM pool name; any name works
  creation: WithCluster                       # the initial pool, created together with the IBM cluster
  flavor: "${IBMCLOUD_WORKER_FLAVOR:=cx2.2x4}"
  # Immutable; for more zones, add them to the IBMCloudManagedCluster and create a new pool there. See
  # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/topology.html#zones-are-chosen-at-create-time
  zones:
  - name: "${IBMCLOUD_ZONE_1}"
  - name: "${IBMCLOUD_ZONE_2}"
  - name: "${IBMCLOUD_ZONE_3}"
  workerUpdates:
    # Manual: worker fix packs roll only after spec.rollout.after; Automatic: as soon as IBM offers them. See
    # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/upgrades.html#worker-fix-packs-and-the-update-policy
    policy: "${WORKER_UPDATE_POLICY:=Manual}"
  # To replace every worker on request, set spec.rollout.after; see
  # https://cluster-api-ibmcloud.sigs.k8s.io/topics/managed/upgrades.html#rolling-workers-on-request-specrolloutafter
