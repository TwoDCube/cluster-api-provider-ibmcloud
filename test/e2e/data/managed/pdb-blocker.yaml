# Blocking PodDisruptionBudget of the managed IKS lane (test/e2e/managed_test.go): one pod on every worker (required
# anti-affinity) and a budget that requires all of them, so no drain may evict any pod and CAPIBM must report
# DrainBlocked and replace no worker. The lane then lowers minAvailable by one.
# The placeholders (a dollar sign and a name in braces) are filled by the suite (applyProbeManifest with
# managedtools.ExpandPlaceholders), not by envsubst; pdb-probe.yaml describes the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocker
  namespace: ${PROBE_NAMESPACE}
spec:
  replicas: ${BLOCKER_REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: blocker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocker
        ${PROBE_LABEL}: "true"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: blocker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blocker
          image: ${PROBE_IMAGE}
          command: ["sh", "-c", "trap 'sleep 20; exit 0' TERM; while true; do sleep 1; done"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blocker
  namespace: ${PROBE_NAMESPACE}
spec:
  minAvailable: ${BLOCKER_REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: blocker
