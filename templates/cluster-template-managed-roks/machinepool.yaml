---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachinePool
metadata:
  name: "${CLUSTER_NAME}-default"
spec:
  clusterName: "${CLUSTER_NAME}"
  # Total across zones; a multiple of the zone count. 6 = 2 workers in each of the 3 zones, IBM's HA topology: "Plan to
  # have at least two worker nodes per zone, so six nodes across three zones in total", and full coverage under IBM's
  # HA SLA needs "at least 6 worker nodes, two worker nodes per zone" (IBM docs, openshift strategy.md, 2026-11-05);
  # "Ingress requires at least two worker nodes per zone" (ts-ingress-alb-pods-nodes.md, 2026-04-06). CAPIBM requires
  # at least 2 ROKS workers per zone at create (whether IBM counts 2 per zone or in total is not yet verified against
  # IBM Cloud), so 6 is also the smallest value this three-zone flavor accepts at create; fewer ROKS workers mean fewer
  # zones, i.e. the managed-roks-single-zone flavor.
  replicas: ${WORKER_MACHINE_COUNT:=6}
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      bootstrap:
        dataSecretName: ""
      # Drain knobs (CAPI-native; read by CAPIBM before every worker removal). Unset = wait as long as PDBs require.
      # deletion:
      #   nodeDrainTimeoutSeconds: 3600
      #   nodeVolumeDetachTimeoutSeconds: 600
      # minReadySeconds: 60                  # replacement soak before the next worker is touched
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: IBMCloudManagedMachinePool
        name: "${CLUSTER_NAME}-default"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: IBMCloudManagedMachinePool
metadata:
  name: "${CLUSTER_NAME}-default"
spec:
  poolName: default                           # the IBM pool name; IBM accepts any valid name
  # The initial pool: IBM creates it together with the cluster (exactly one pool of the Cluster says so; others omit
  # it or say AfterCluster).
  creation: WithCluster
  flavor: "${IBMCLOUD_WORKER_FLAVOR:=bx2.4x16}"  # ROKS needs at least 4 vCPU and 16 GB
  # The same three zones; immutable. Give the initial ROKS pool every zone the cluster will ever use: IBM does
  # not extend the router load balancer to zones added later.
  zones:
  - name: "${IBMCLOUD_ZONE_1}"
  - name: "${IBMCLOUD_ZONE_2}"
  - name: "${IBMCLOUD_ZONE_3}"
  workerUpdates:
    policy: "${WORKER_UPDATE_POLICY:=Manual}"  # Manual: fix packs roll only after rollout.after; Automatic: as IBM offers them
  # rollout:
  #   after: "2026-11-20T09:00:00Z"           # replace every worker whose Node is older, one at a time, drained
